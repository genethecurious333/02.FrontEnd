<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>multiplication table 구구단</title>
    <script>
        for (let i = 2; i <= 9; i++) {
            document.write("<h4>" + i + "단</h4>");
            for (let j = 1; j <= 9; j++) {
               document.write( i + " X " + j + "=" + (i*j) + "<hr>"); 
            }
            document.write("<br>")
        }
    </script>
</head>
<body>
    
</body>
</html>
