<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise를 통한 데이터 연동</title>
    <script>
        const getData = new Promise((resolve, reject) => {
            const data = "서버에서 받아온 회원 데이터";

            if (data) {
                resolve(data); // 네트워크를 통해 데이터 받아오기 성공했을때
            } else {
                reject(new Error("데이터를 가져오는데 실패했어요"));
            }
        });

        // 결과를 받아서 처리 
        getData.then((response) => {
            console.log("성공한 데이터:", response);
        }).catch((error) => {
            console.error("실패:", error);
        })

    </script>
</head>
<body>
    
</body>
</html>
