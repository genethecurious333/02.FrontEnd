<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>some() 함수</title>
    <script>
        const subjects = ["쓰기", "듣기", "말하기"];
        const arr1 = subjects.map((subject) => {
            return prompt(`영어 ${subject}의 점수는?`, 0);
        });

        console.log(arr1);

        let result = arr1.some((score) => (score < 60)); // some(), every()는 bool
        console.log(result);

        result = result? "불합격": "합격";
        document.write("<h1>", result, "</h1>")

        const arr2 = [1, 3, 10]
        result = arr1.every((score) => (score % 2 != 0));
        result = result? "모두 홀수": "모두 홀수 아님";
        document.write("<h1>", result, "</h1>");

    </script>
</head>
<body>
    
</body>
</html>
