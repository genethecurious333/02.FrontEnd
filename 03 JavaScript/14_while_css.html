<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>while문(2)</title>
    <style>
        .red { background-color: red; color:white;}
        .blue { background-color: blue; color:white;}
    </style>
    <script>
        let i = 20;

        while (i-- >= 10) {
            if (i % 2 == 0) {
                document.write("<p class='red'>" + i + "는 짝수입니다.</p>")
            } else {
                document.write("<p class='blue'>" + i + "는 홀수입니다.</p>")
            }
        }
    </script>
</head>
<body>
    
</body>
</html>
