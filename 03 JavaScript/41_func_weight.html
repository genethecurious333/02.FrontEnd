<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체 생성자 함수</title>
    <script>
        function CheckWeight(name, height, weight) {
            this.name = name;
            this.height = height;
            this.weight = weight;
            this.minweight;
            this.maxweight;

            this.getInfo = function() {
                let str = ""
                str += "이름:" + this.name + " , ";
                str += "키:" + this.height + " , ";
                str += "몸무게:" + this.weight + "<br>";
                return str;
            }

            this.getResult = function() {
                this.minWeight = (this.height - 100) * 0.9 - 5;
                this.maxWeight = (this.height - 100) * 0.9 + 5;

                if (this.weight >= this.minWeight && 
                    this.weight <= this.maxWeight) {
                        return "정상 몸무게입니다.<hr>";
                } else if(this.weight < this.minWeight) {
                        return "정상 몸무게보다 미달입니다.<hr>"
                } else {
                        return "정상 몸무게보다 초과입니다.<hr>";
                }
            }
        }

        const jang = new CheckWeight("장보리", 168, 62)
        const park = new CheckWeight("박달재", 188, 88);

        console.log(jang);
        console.log(park);

        document.write(jang.getInfo());
        document.write(jang.getResult());

        document.write(park.getInfo());
        document.write(park.getResult());

    </script>
</head>
<body>
    
</body>
</html>
