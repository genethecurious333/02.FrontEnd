<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수에서 arguments 사용하기</title>
    <script>
        function sum() {
            let sum = 0;
            for (num of arguments) {
                sum += num;
            }

            document.write(sum);
        }
        
        sum(10, 20, 30, 40, 50);
        
    </script>
</head>
<body>
    
</body>
</html>
