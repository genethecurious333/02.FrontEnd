<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boolean자료형</title>
    <script>
        let a = true; 
        let b = false;
        let c = 10 > 5;
        let d = Boolean("hello");
        document.write("a => ", a, "<br>");
        document.write("b => ", b, "<br>");
        document.write("c => ", c, "<br>");
        document.write("d => ", d);
    </script>
</head>
<body>
    
</body>
</html>
