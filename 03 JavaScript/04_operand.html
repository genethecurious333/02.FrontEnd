<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연산자</title>
    <script>
        let num1 = 15;
        let num2 = 2;
        let result;
        result = num1 + num2;
        document.write(num1, "+", num2, "=", result, "<br>");
        result = num1 - num2;
        document.write(num1 + "x" + num2 + "=" + result + "<br>");
        result = num1 * num2;
        document.write(num1, "*", num2, "=", result, "<br>");
        result = num1 % num2 
        document.write(`${num1} % ${num2} = ${result}<br>`); // 자판숫자1 옆 back-tik "`"을 쓴다
        result = num1 / num2;
        document.write(num1, "/", num2, "=", result)
    </script>
</head>
<body>
    
</body>
</html>
