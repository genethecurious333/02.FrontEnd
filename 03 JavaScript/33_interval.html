<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>setInterval/clearInterval</title>
    <script>
        let addNum = 0;
        let subNum = 1000;

        const auto_1 = setInterval(function() {
            addNum++;
            console.log("addNum:", addNum);
        }, 3000);

        const auto_2 = setInterval(function() {
            subNum--;
            console.log("subNum:", subNum);

        }, 3000);

        let addNum2 = 0;
        const auto = setTimeout(function() {
            addNum2++;
            console.log("setTimeout()  ===> ", addNum2);
        }, 5000)
        
    </script>
</head>
<body>
    <button onclick="clearInterval(auto_1)">증가 정지</button>
    <button onclick="clearInterval(auto_2)">감소 정지</button>    
</body>
</html>
