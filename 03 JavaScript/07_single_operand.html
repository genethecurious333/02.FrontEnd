<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단일 연산자</title>
    <script>
        let num1 = 10;
        let num2 = 20;
        let result;
        
        num1--;
        document.write("result=", result, ", num1=", num1, "<hr>");

        num1++; 
        document.write("result=", result, ", num1=", num1, "<hr>");
        
        result = num1--;
        /* num1 = num1 - 1 , 사용후 감소 */
        document.write("result=", result, ", num1=", num1, "<hr>");

        result = num1++; 
        /* num1 = num1 +1 * 사용후 증가 */
        document.write("result=", result, ", num1=", num1, "<hr>");

        result = num2++;
        /* result = num2; 
           num2 = num2 + 1; 사용후 증가 */
        document.write("result=", result, ", num2=", num2, "<hr>");

        result = ++num2;
        /* result = num2 + 1; 증가후 사용*/
        document.write("result=", result, ", num2=", num2, "<hr>");
        
        result = --num2;
        /* num2 = num2 - 1; 감소후 사용*/
        document.write("result=", result, ", num2=", num2, "<hr>");

    </script>
</head>
<body>
    
</body>
</html>
