<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>typeof 알아보기</title>
    <script>
        let num = 100;
        let str = "JavaScript";
        // const bool = true; 
        let bool = true; // const로 지정했을경우 error
        bool = "자바스크립트";
        str = null; // object
        let num2; // 선언만 했을경우는 undefined

        document.write(typeof num, "<hr>");
        document.write(typeof num2, "<hr>");
        document.write(typeof str, "<hr>");
        document.write(typeof bool,);
      
    </script>
</head>
<body>
    
</body>
</html>
