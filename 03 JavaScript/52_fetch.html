<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch api 사용하기</title>
    <style>
        table {
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: white;
        }
        td, th {
            border: 1px solid black;
            padding: 15px;
                    }

        tr:nth-child(even) {
            background-color: #e7e1e1;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        
    </style>
    <script>
        fetch('https://jsonplaceholder.typicode.com/posts')
        .then((response) => {
            return response.json();
        })
        .then((data) => {
            console.log("Data 1:", data);
        });

        const getData = async() => {
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/posts'); // await 함수는 async함수 안에서만 사용할수 있다. fetch가 비동기이므로 await를 넣어서 잠시 동기화하는 것임
                const data = await response.json();
                console.log("Data 2:", data.slice(0, 10));
                const tbody = document.querySelector('#fetchTable tbody');
                data.slice(0, 10).forEach(items => {
                    const row = document.createElement('tr');

                    const idCell = document.createElement('td');
                    idCell.textContent = items.id;
                    row.appendChild(idCell);

                    const titleCell = document.createElement('td');
                    titleCell.textContent = items.title;
                    row.appendChild(titleCell);

                    const bodyCell = document.createElement('td');
                    bodyCell.textContent = items.body;
                    row.appendChild(bodyCell);
                    
                    tbody.appendChild(row);
                });
            } catch(error) {
                console.log("데이터 바인딩 실퍠:", error);
            }
        };

        // 함수 실행
        getData();

    </script>


</head>
<body>
   <h2>가상 API 게시글 목록</h2>
   <!-- table>thead>tr>(th*3)  -->
    <table id="fetchTable">
        <thead>
            <tr>
                <th>Id</th>
                <th>Title</th>
                <th>Body</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>
</body>
</html>
