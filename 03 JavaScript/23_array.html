<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열의 함수들</title>
    <script>
        const arr_1 = ["사당", "교대", "방배", "강남"];
        const arr_2 = ["신사", "압구정", "옥수"];

        let result = arr_1.join("-");
        console.log(result);

        result = arr_1.concat(arr_2);
        console.log(result);

        result = arr_1.slice(1, 3);
        console.log(result);

        result = arr_1.sort();
        console.log(result);

        result = arr_2.reverse();
        console.log(result);

        for (item of result){
            console.log(`[${item}]`);
        }
        
    </script>
</head>
<body>
    
</body>
</html>
