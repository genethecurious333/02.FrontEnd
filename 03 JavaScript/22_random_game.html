<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가위 바위 보 게임</title>
    <script>
        const game = prompt("가위, 바위, 보중 선택하세요 >", "가위");
        let gameNum;
        switch (game) {
            case "가위":
                gameNum = 1;
                break;
            case "바위":
                gameNum = 2;
                break;
            case "보":
                gameNum = 3;
                break;
            default: alert("잘못 작성하셨습니다.");
                location.reload();
                      
         }

         const comNum = Math.ceil(Math.random() * 3);
         document.write("컴퓨터가 뽑은 번호:", comNum, "<br>")
         if (gameNum == comNum) {
            document.write("정답");
         }else{
            document.write("아쉽군요!");
         }

    </script>
</head>
<body>
    
</body>
</html>
