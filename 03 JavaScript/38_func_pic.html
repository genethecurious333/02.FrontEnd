<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>갤러리를 보여주는 함수</title>
    <script>
        let num = 1;
        function gallery(direct) {
            if (direct) {
                if (num == 8) return;
                num++;
            } else {
                if (num == 1) return;
                num--;
            }

            const imgTag = document.getElementById("photo");
            imgTag.setAttribute("src", "images/pic_"+num+".jpg");
        }
    </script>
</head>
<body>
    <div id="gellaryZone">
        <p><img src="images/pic_1.jpg" id="photo" alt=""></p>
        <p>
            <button onclick="gallery(0)">이전</button>
            <button onclick="gallery(1)">다음</button>
        </p>
    </div>
</body>
</html>
