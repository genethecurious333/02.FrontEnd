<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 상세 페이지</title>
</head>
<body>
    <div class="book-container">
        <div class="book-cover-section">
            <img src="" alt="도서 표지 이미지" id="book-thumbnail">
        </div>
        <div class="book-info-section">
            <h1 id="book-title" class="book-title">로딩중...</h1>
            <p id="book-contents" class="book-subtitle"></p>
            <div id="book-meta" class="book-meta"></div>

            <div class="info-table">
                <div class="info-label">정가</div>
                <div id="price-original" class="info-value price-original">-원</div>

                <div class="info-label">판매가</div>
                <div class="info-value">
                    <span id="price-sale" class="price-sale">-원</span>
                    <span class="discount-badge">[10% 할인]</span>
                </div>

                <div class="info-label">배송료</div>
                <div class="info-value" style="color:#888">무료</div>
                <div class="info-label">주문수량</div>
                <div class="info-value">
                    <div class="quantity-wrapper">
                        <button class="quantity-btn" onclick="changeQuantity(-1)">-</button>
                        <input type="text" id="quantity" class="quantity-input" value="1" readonly>
                        <button class="quantity-btn" onclick="changeQuantity(+1)">+</button>
                    </div>
                </div>

                <div class="total-price-section">
                    <span class="total-label">합계</span>
                    <span class="total-amount" id="total-amount">-원</span>
                </div>
                <div class="button-group">
                    <button class="btn btn-cart">장바구니</button>
                    <button class="btn btn-buy">바로구매</button>
                    <button class="btn">선물하기</button>
                    <button class="btn">보관함 +</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/script-bookDetail.js"></script>
    
</body>
</html>
