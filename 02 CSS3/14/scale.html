<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
		<title>Transform:scale</title>
    <style>
			#container{
				width:600px;
				margin:20px auto;
			}
			.origin {
				width: 100px;
				height: 100px;
				border: 1px solid black;
				float: left;
				margin: 40px;
			}
			.origin > div {				
				width:100px;
				height:100px;
				background-color:orange;
				transition: 1s;
			}
      /* Do it! scale 함수로 확대,축소하기 */
			#scalex:hover { transform: scaleX(2);}
			#scaley:hover { transform: scaley(2);}
			#scale:hover { transform: scale(0.5);}
			#scale3d:hover { 
				transform: rotateX(40deg);}
			#per {perspective: 100px;}

    </style>
	</head>
	<body>
		<div id="container">		
			<div class="origin">
				<div id="scalex"></div>
			</div>
			<div class="origin">
				<div id="scaley"></div>
			</div>
			<div class="origin">
				<div id="scale"></div>
			</div>
			<div class="origin" id="per">
				<div id="scale3d"></div>
			</div>
		</div>		
	</body>
</html>
