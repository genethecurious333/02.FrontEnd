<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>text-decoration</title>
    <style>
      a {
        text-decoration: none;
      }
      .uline {
        text-decoration: underline;
      }
      .oline {
        text-decoration: overline;
      }
      .lthrough {
        text-decoration: line-through;
      }
    </style>
  </head>
  <body>
    <h1>text-decoration 속성</h1>
    <!-- Do it! 인라인 스타일을 사용해 text-decoration 속성 적용하기 -->
    <p><a href="#">none</a></p>
    <p class="uline">underline</p>
    <p class="oline">overline</p>
    <p class="lthrough">line through</p>
  </body>
</html>
