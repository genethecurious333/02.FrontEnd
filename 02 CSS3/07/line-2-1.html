<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>line-height</title>
    <style>
        h1 {
            font-size: 60px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        .heading {
            width: 100%;
            height: 100px;
            background: #222;
            color: #fff;
            text-align: center;
            line-height: 100px;
            /* line-height는 글자의 상하 간격조절 */
        }
    </style>
</head>
<body>
    <h1 class="heading">HTML</h1>
</body>
</html>
