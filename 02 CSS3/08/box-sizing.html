<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
  <title>박스모델</title>  
	<style>
    div {
      margin-bottom: 20px;
    }
    .box1 {
      border: 1px solid blue;
      width: 200px;
      height: 100px;
    }
    .box2 {
      box-sizing: border-box;
      border: 1px solid red;
      width: 200px;
      height: 100px;
    }
	</style>
</head>
<body>
  <div class="box1"></div>
  <div class="box2"></div>
</body>
</html>
