<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>박스모델 - 마진</title>
	<style>
    * {
      margin: 0;
      padding: 0;
    }
    div {
      width:200px;
      height:100px;
      /* display:inline-block;  */
      border:1px solid #222;
    }
    /* Do it! 박스 모델에 마진 지정하기 */
    /* # = id */
    #margin1 {
      margin: 30px 50px;
      background-color: orangered
    }
    #margin2 {
      margin: 30px 50px;
      background-color: red;
    }
    #margin3 {
      margin: 30px 20px 50px;
      background-color: aquamarine;
    }
    #margin4 {
      margin: 30px 50px ;
      background-color: blue
    }
    #margin5 {
      display: block; 
      margin: 30px auto;
      background-color:blueviolet;
    }

	</style>
</head>
<body>
  <div id="margin1"></div>
  <div id="margin2"></div>
  <div id="margin3"></div>
  <div id="margin4"></div>
  <div id="margin5"></div>
</body>
</html>
